<title>Porto Isometrico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=block">
<style>
  /* Layout: a letterboxed 16:9 stage filling the window, with a slim control bar underneath. Single dark look on purpose. */
  :root { --bg: #15171c; --bar: #1f2229; --fg: #e9ebef; --muted: #9aa1ad; --accent: #ff6b5e; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; overflow: hidden; }
  #cv { display: block; background: #efeaf3; box-shadow: 0 6px 30px rgba(0,0,0,.4); }
  #big { position: absolute; inset: 0; margin: auto; width: 96px; height: 96px; border-radius: 50%; border: 0; background: rgba(21,23,28,.78); color: #fff; cursor: pointer; display: grid; place-items: center; }
  #big svg { width: 40px; height: 40px; margin-left: 6px; }
  .bar { display: flex; align-items: center; gap: 12px; background: var(--bar);
    padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar button { background: none; border: 1px solid #3a3f4a; color: var(--fg); border-radius: 6px; height: 34px; min-width: 40px; padding: 0 10px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; gap: 6px; }
  .bar button:focus-visible, #seek:focus-visible, #big:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar button[aria-pressed="false"] { color: var(--muted); }
  #seek { flex: 1; min-width: 60px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
  @media (max-width: 480px) { .lbl { display: none; } #time { min-width: 0; } }
</style>
<style>
  .vo { position: relative; overflow: hidden; }
  .vo input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .vo.loaded { border-color: var(--accent) !important; }
  #drop { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(21,23,28,.72); color: #fff; font-size: 22px; font-weight: 600; pointer-events: none; }
  #voname { color: var(--muted); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 640px) { #voname { display: none; } }
</style>
