<div id="stage"><canvas id="cv" width="1280" height="720" aria-label="Animated whiteboard explainer: how a port is built"></canvas>
  <button id="big" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></button></div>
<div class="bar">
  <button id="play" aria-label="Play">▶</button>
  <input id="seek" type="range" min="0" max="24" step="0.01" value="0" aria-label="Scrub">
  <span id="time">0.0 / 24.0</span>
  <button id="snd" aria-pressed="true" title="Sound on/off">♪ <span class="lbl">Sound</span></button>
  <button id="loop" aria-pressed="true" title="Loop">⟲ <span class="lbl">Loop</span></button>
</div>
<script>
(async function () {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
  const stage = document.getElementById('stage'), seekEl = document.getElementById('seek'), timeEl = document.getElementById('time');
  const playBtn = document.getElementById('play'), big = document.getElementById('big'), sndBtn = document.getElementById('snd'), loopBtn = document.getElementById('loop');
  const D = window.DURATION;
  seekEl.max = D;
  let t = 0, playing = false, last = 0, soundOn = true, loop = true, stopSound = null;

  function fit() { const s = Math.min(stage.clientWidth / 1280, stage.clientHeight / 720); cv.style.width = (1280 * s) + 'px'; cv.style.height = (720 * s) + 'px'; }
  addEventListener('resize', fit); fit();

  function draw(tt) {
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    window.explainer(ctx, 1280, 720, tt);
  }
  window.seek = (tt) => { t = Math.max(0, Math.min(D, tt)); draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(1) + ' / ' + D.toFixed(1); };

  const killSound = () => { if (stopSound) { stopSound(); stopSound = null; } };
  const startSound = () => { killSound(); if (soundOn && playing) stopSound = SOUND.live(window.scoreSound, t, { voiceover: false }); };

  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play'); big.hidden = p;
    if (p) { if (t >= D) window.seek(0); last = performance.now(); startSound(); requestAnimationFrame(tick); }
    else killSound();
  }
  function tick(now) {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= D) {
      if (loop) { window.seek(0); startSound(); }
      else { window.seek(D); setPlaying(false); return; }
    } else window.seek(t);
    requestAnimationFrame(tick);
  }
  playBtn.onclick = big.onclick = () => setPlaying(!playing);
  seekEl.addEventListener('input', () => { killSound(); window.seek(+seekEl.value); last = performance.now(); });
  seekEl.addEventListener('change', () => { if (playing) startSound(); });
  sndBtn.onclick = () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); if (soundOn) startSound(); else killSound(); };
  loopBtn.onclick = () => { loop = !loop; loopBtn.setAttribute('aria-pressed', loop); };
  addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });

  try { await Promise.all(['400 74px "Permanent Marker"', '700 30px Kalam', '400 30px Kalam'].map((f) => document.fonts.load(f, 'AaZz09àè·→✓'))); await document.fonts.ready; } catch (e) {}
  window.seek(0);
  window.__ready = true;
})();
</script>
